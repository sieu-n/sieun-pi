# ci-cache-rsyncd: serves the box's CI cache to the Mac's ci-cache-mirror (deploy/mac/ci-cache-mirror.mjs) with no login.
# The mirror pulled every 15 s over ssh, and each Tailscale SSH command opened a logind session and a session-*.scope:
# 240 of the box's 427 session scopes from 02:23Z to 03:23Z on 11-03. A daemon connection is a fork and starts no unit.
# The daemon listens on loopback, and `tailscale serve --tcp` puts the port on the tailnet (ci-cache-rsyncd.service).
use chroot = no
hosts allow = 127.0.0.1
reverse lookup = no
log file = /dev/null

[virev]
path = %HOME%/.cache/virev
read only = yes

[ci-wants]
path = %HOME%/.cache/virev/ci-wants
read only = no
write only = yes
