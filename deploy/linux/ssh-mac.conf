# The Mac over Tailscale. Installed from sieun-pi deploy/linux/ssh-mac.conf by setup-host.sh.
# Each ssh reuses one of 16 masters, picked by ssh-mac-slot from its pid. The Mac's sshd keeps the
# default MaxSessions 10 (no passwordless sudo there), and 55 to 88 box ssh processes ran at once
# during land bursts on 2026-10-18, so one master refused sessions past 10 and the fallback fresh
# handshakes (about 11 round trips, 2.2 s) tripped the Mac's MaxStartups 10:30:100.
# Keep % and $ out of the exec commands: ssh expands both there, and git's ssh calls failed with
# "vdollar_percent_expand: unknown key %" on a $((PPID %% 32)) test.

Match originalhost mac,100.66.173.18,main-dev-sieuns-macbook-pro-m2max,main-dev-sieuns-macbook-pro-m2max.tail0c093d.ts.net exec "/home/sieun/.local/bin/ssh-mac-slot 0"
  ControlPath ~/.ssh/cm/%r@%h:%p.0

