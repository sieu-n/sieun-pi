# Hang recovery for a Linux box (README.md next to this file). systemd pets the BMC's IPMI watchdog (ipmi_watchdog,
# ipmi-watchdog.conf); when PID 1 stops running for RuntimeWatchdogSec, the BMC hard-resets the box.
# measured: on 2026-10-27 us-metal02 hung after a global OOM at 15:14:51Z, logged nothing after 15:14:58Z and stayed down
# 91 min until an out-of-band reset at 16:46Z; 3 min is far under that hang, and no stall of PID 1 that long has been seen.
[Manager]
RuntimeWatchdogSec=3min
RebootWatchdogSec=10min
