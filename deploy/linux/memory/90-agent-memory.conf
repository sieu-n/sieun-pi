# Memory layer 6 of https://cho.sh/ko/1983DC, set on the owner's ask of 2026-10-19 ("implement something like
# https://cho.sh/ko/1983DC so it's as convinient as possible and reasonable"). Installed by setup-memory.sh.
# Swap early into zswap's compressed pool instead of dropping page cache first.
vm.swappiness = 100
# kswapd wakes at 1.25% of RAM free (about 3 GiB on us-metal02) instead of 0.1%, so reclaim starts before a stall.
vm.watermark_scale_factor = 125
# 1 GiB emergency reserve, 11.6x the 88 MiB the kernel picked for 247 GiB, which is 0.4% of RAM.
vm.min_free_kbytes = 1048576
