# Installed as /etc/systemd/system/earlyoom.service.d/limits.conf. The packaged unit sets MemoryMax=50M and TasksMax=10,
# which the owner never asked for (c107). On 10-26 at 02:24:09Z the 50M memcg killed earlyoom itself in the middle of a
# box-wide shortage: usage 51,196 of 51,200 kB, of which 51.4 MB was reclaimable slab from reading /proc of
# about 11,000 processes and 452 kB its own anon memory. Its -N hook also runs inside this unit.
[Service]
MemoryMax=infinity
TasksMax=infinity
