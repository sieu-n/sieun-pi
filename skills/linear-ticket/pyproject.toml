[project]
name = "linear-ticket"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pillow", "httpx"]

[project.scripts]
linear_ticket = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear_ticket"]
