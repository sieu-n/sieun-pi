# Slack app manifest for the sieun-pi chat bridge (components/user-history/src/chat-slack.ts).
# Create the app: api.slack.com/apps > Create New App > From a manifest > pick the workspace > paste this file.
# Then:
#   1. Install to Workspace (or Request to Install when an admin must approve), copy the Bot User OAuth Token (xoxb-).
#   2. Basic Information > App-Level Tokens > Generate, scope connections:write, copy the token (xapp-).
#   3. security add-generic-password -U -s sieun-pi-slack -a bot-token -w   (paste the xoxb- token)
#      security add-generic-password -U -s sieun-pi-slack -a app-token -w   (paste the xapp- token)
#   4. Chat Settings > Slack: enter your member id, turn on "Link chats to Slack".
# Socket Mode needs no Request URL: the chat service opens one outbound WebSocket.
display_information:
  name: VP chats
  description: Links each sieun-pi chat to a private channel. Only the owner's messages reach the chats.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: vp
    always_online: true
oauth_config:
  scopes:
    bot:
      # post replies and pings
      - chat:write
      # private channels: create, invite the owner, archive (groups:write); read owner messages (groups:history); list (groups:read)
      - groups:write
      - groups:history
      - groups:read
      # the working reaction on an owner message
      - reactions:write
      # images in and out (phase 2)
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      # messages in the private channels the bot is in
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
