# ~/.config/environment.d/60-prime-agent-launch.conf on us-metal02, with @UID@ replaced by `id -u` and @HOME@ by $HOME at install.
# Every user service and systemd-run unit then carries Prime load.3's service-placement hook, so a prime-agent that
# finds no supervisor on the public socket starts prime-agent-daemon.service instead of a daemon in its own cgroup.
# prime-agent-daemon-start sends no start while the unit reloads, because systemd would run that reload again.
PRIME_AGENT_DAEMON_LAUNCH_COMMAND=@HOME@/.local/bin/prime-agent-daemon-start prime-agent-daemon.service
PRIME_AGENT_DAEMON_LAUNCH_FOR_SOCKET=/tmp/prime-agent-@UID@/daemon.sock
